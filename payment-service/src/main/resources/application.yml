# payment-service — owns database `careeros_payment` on its dedicated PostgreSQL instance.
# Shared, profile-independent configuration is imported from careeros-common.
spring:
  application:
    name: payment-service
  config:
    import: "classpath:application-common.yml"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/careeros_payment}
    username: ${DB_USERNAME:careeros}
    password: ${DB_PASSWORD:careeros}
    hikari:
      pool-name: payment-cp
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}

server:
  port: ${SERVER_PORT:8084}
