# FastAPI AI service CI — install deps and smoke-import the app.
name: ai-service-ci

on:
  push:
    branches: [main]
    paths: ["ai-service/**", ".github/workflows/ai-service-ci.yml"]
  pull_request:
    paths: ["ai-service/**", ".github/workflows/ai-service-ci.yml"]

defaults:
  run:
    working-directory: ai-service

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Import-time check: the app wires up without a running model provider.
      - name: Smoke import
        run: python -c "from app.main import app; print('ai-service import OK')"
