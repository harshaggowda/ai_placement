# =============================================================================
# CareerOS — reverse-proxy placeholder.
#
# Intended production edge: a single public host that terminates TLS, serves the
# built React app, and forwards /api to the API Gateway. This file documents that
# topology; it is NOT yet wired into docker-compose (the API Gateway is the edge
# for local dev). To activate, add an `nginx` service to infrastructure/docker/
# docker-compose.yml mounting this file and exposing :80/:443.
# =============================================================================

upstream api_gateway {
    server api-gateway:8080;
}

upstream web_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # API traffic → Spring Cloud Gateway (the only backend the browser reaches).
    location /api/ {
        proxy_pass         http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Correlation id propagation for end-to-end tracing.
        proxy_set_header   X-Trace-Id        $request_id;
    }

    # Everything else → static SPA, with client-side routing fallback.
    location / {
        proxy_pass http://web_frontend;
        proxy_set_header Host $host;
    }
}
