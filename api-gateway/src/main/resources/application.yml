# =============================================================================
# API Gateway — the single public entry point (reactive Spring Cloud Gateway).
#
# Routing is a PLACEHOLDER in this foundation (spec: "do not configure routes yet").
# Concrete routes are added under `spring.cloud.gateway.server.webflux.routes` per
# service once endpoints exist. CORS and a global correlation-id/logging filter are
# configured in code (see config/ and filter/); health + actuator are exposed below.
# =============================================================================
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # routes: []   # ← add downstream routes here when services expose endpoints
          # X-Forwarded handling is disabled by default in Spring Cloud Gateway 4.x;
          # set trusted-proxies once a real proxy/load-balancer fronts the gateway.

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
